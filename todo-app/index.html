<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow – Aufgaben-App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>FocusFlow</h1>
        <p>Eine einfache Aufgaben-App mit lokalem Speicher.</p>
      </header>

      <section class="card">
        <form id="todo-form" class="todo-form" autocomplete="off">
          <label for="todo-input" class="sr-only">Neue Aufgabe</label>
          <input id="todo-input" name="todo" type="text" placeholder="Neue Aufgabe eingeben ..." required maxlength="120" />
          <button type="submit">Hinzufügen</button>
        </form>
      </section>

      <section class="card controls" aria-label="Filter und Aktionen">
        <div class="filters" role="group" aria-label="Aufgaben filtern">
          <button type="button" data-filter="all" class="is-active">Alle</button>
          <button type="button" data-filter="open">Offen</button>
          <button type="button" data-filter="done">Erledigt</button>
        </div>
        <button type="button" id="clear-done" class="ghost">Erledigte löschen</button>
      </section>

      <section class="card">
        <p id="empty-state" class="empty-state">Noch keine Aufgaben vorhanden.</p>
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input type="checkbox" class="todo-item__toggle" />
          <span class="todo-item__text"></span>
        </label>
        <button type="button" class="todo-item__delete" aria-label="Aufgabe löschen">✕</button>
      </li>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
